<!DOCTYPE html>
<!-- FlightTool(가칭) 공항 허브 — 빌드 없는 정적 PWA 셸 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151d">
<title>공항 허브 — FlightTool</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="src/style.css">
</head>
<body data-theme="dark">
<header>
  <div class="brand">
    <span class="logo">✈︎</span>
    <div><h1 id="appTitle">공항 허브</h1><div class="tagline" id="tagline"></div></div>
  </div>
  <div class="header-actions">
    <button id="btnRefresh" class="icon-btn" title="refresh">↻</button>
    <button id="btnTheme" class="icon-btn" title="theme">☀️</button>
    <button id="btnLang" class="icon-btn txt" title="language">EN</button>
  </div>
</header>

<main>
  <div id="offlineNote" class="offline-note" hidden></div>
  <div id="cards" class="cards"></div>
  <form id="addForm" class="add-form" autocomplete="off">
    <input id="addInput" maxlength="4" placeholder="ICAO (예: RJTT)" spellcheck="false">
    <button type="submit" id="addBtn">추가</button>
  </form>
  <p class="disclaimer" id="disclaimer"></p>
</main>

<script type="module" src="src/app.js"></script>
</body>
</html>
