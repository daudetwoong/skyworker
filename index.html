<!DOCTYPE html>
<!-- SkyWorker — 오늘 내 비행 브리핑 PWA (빌드 없는 정적 셸) -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151d">
<title>SkyWorker — 내 비행</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="stylesheet" href="src/style.css">
</head>
<body data-theme="dark">
<header>
  <div class="brand">
    <span class="logo">✈︎</span>
    <div><h1 id="appTitle">SkyWorker</h1><div class="tagline" id="tagline"></div></div>
  </div>
  <div class="header-actions">
    <button id="btnTime" class="icon-btn txt" title="UTC/Local">Z</button>
    <button id="btnRefresh" class="icon-btn" title="refresh">↻</button>
    <button id="btnTheme" class="icon-btn" title="theme">☀️</button>
    <button id="btnLang" class="icon-btn txt" title="language">EN</button>
  </div>
</header>
<nav class="tabs">
  <button id="tabFlight" class="tab tab-on">내 비행</button>
  <button id="tabAirports" class="tab">공항</button>
</nav>
<main>
  <div id="offlineNote" class="offline-note" hidden></div>
  <div id="view"></div>
  <p class="disclaimer" id="disclaimer"></p>
</main>
<script type="module" src="src/app.js"></script>
</body>
</html>
